<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSS Disclaimer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #0b0f14 0%, #14161c 100%);
      color: rgba(255, 255, 255, 0.9);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 30px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.9);
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header .subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
    }

    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .lang-btn {
      padding: 8px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(10, 12, 16, 0.8);
      color: rgba(255, 255, 255, 0.7);
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .lang-btn:hover {
      background: rgba(120, 190, 255, 0.14);
      border-color: rgba(120, 190, 255, 0.45);
    }

    .lang-btn.active {
      background: rgba(120, 190, 255, 0.35);
      border-color: rgba(120, 190, 255, 0.7);
      color: rgba(255, 255, 255, 0.95);
    }

    .disclaimer-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .disclaimer-title {
      font-size: 18px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .disclaimer-content {
      font-size: 14px;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.8);
    }

    .disclaimer-content p {
      margin-bottom: 12px;
    }

    .disclaimer-content strong {
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
    }

    .disclaimer-content ul {
      margin-left: 20px;
      margin-bottom: 12px;
    }

    .disclaimer-content li {
      margin-bottom: 8px;
    }

    .disclaimer-content a {
      color: #4a90e2;
      text-decoration: none;
      transition: color 0.2s;
    }

    .disclaimer-content a:hover {
      color: #6ab0ff;
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      padding: 30px 0;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
    }

    .footer a {
      color: #4a90e2;
      text-decoration: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

      <h1>🛡️ GSS Disclaimer</h1>

    </div>

    <div class="lang-switch">
      <button class="lang-btn active" data-lang="zh-TW">繁中</button>
      <button class="lang-btn" data-lang="zh-CN">简中</button>
      <button class="lang-btn" data-lang="en">English</button>
      <button class="lang-btn" data-lang="ja">日本語</button>
      <button class="lang-btn" data-lang="ko">한국어</button>
    </div>

    <div id="disclaimer-container"></div>

    <div class="footer">
      Made by <a href="https://github.com/ElfinL" target="_blank" rel="noopener">Elfin</a>

    let currentLang = 'zh-TW';

    function renderDisclaimer() {
      const container = document.getElementById('disclaimer-container');
      const data = DISCLAIMER_DATA[currentLang] || DISCLAIMER_DATA['zh-TW'];
      
      container.innerHTML = `
        <div class="disclaimer-card">
          <div class="disclaimer-title">${data.title}</div>
          <div class="disclaimer-content">
            ${data.content.join('')}
          </div>
        </div>
      `;
    }

    function switchLanguage(lang) {
      currentLang = lang;
      
      // 更新按鈕狀態
      document.querySelectorAll('.lang-btn').forEach(btn => {
        if (btn.dataset.lang === lang) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      
      renderDisclaimer();
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      // 綁定語言切換按鈕
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchLanguage(btn.dataset.lang);
        });
      });
      
      // 渲染初始內容
      renderDisclaimer();
    });
  </script>
