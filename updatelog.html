    // 配置
    const SUPPORTED_LANGS = ['zh-TW', 'zh-CN', 'en', 'ja', 'ko'];
    let currentLang = 'zh-TW';

    // 创建版本卡片 HTML
    function createVersionCard(version, index) {
      const isLatest = version.isLatest;
      const badgeHtml = isLatest ? '<div class="version-badge">NEW</div>' : '';
      
      let contentHtml = '';
      if (Array.isArray(version.content)) {
        contentHtml = version.content.map(item => `<p>${item}</p>`).join('');
      } else {
        contentHtml = version.content;
      }

      return `
        <div class="version-card ${isLatest ? 'latest' : ''}">
          ${badgeHtml}
          <div class="version-header">
            <span class="version-number">${version.version}</span>
            <span class="version-date">${version.date}</span>
          </div>
          <div class="version-content">
            ${contentHtml}
          </div>
        </div>
      `;
    }

    // 渲染版本列表
    function renderVersions() {
      const container = document.getElementById('version-container');
      const versions = VERSION_DATA[currentLang] || [];
      
      container.innerHTML = versions.map((v, i) => createVersionCard(v, i)).join('');
    }

    // 切换语言
    function switchLanguage(lang) {
      if (!SUPPORTED_LANGS.includes(lang)) return;
      
      currentLang = lang;
      
      // 保存语言偏好
      try {
        localStorage.setItem('updatelogLang', lang);
      } catch (e) {
        // localStorage not available
      }

      // 更新 URL 参数
      const url = new URL(window.location);
      url.searchParams.set('lang', lang);
      if (lang === 'zh-TW') {
        url.searchParams.delete('lang');
      }
      window.history.replaceState({}, '', url.toString());

      // 更新按钮状态
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      // 重新渲染
      renderVersions();
    }

    // 初始化
    function init() {
      // 从 localStorage 或 URL 参数获取语言
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      
      if (urlLang && SUPPORTED_LANGS.includes(urlLang)) {
        currentLang = urlLang;
      } else {
        try {
          const stored = localStorage.getItem('updatelogLang');
          if (stored && SUPPORTED_LANGS.includes(stored)) {
            currentLang = stored;
          }
        } catch (e) {
          // localStorage not available
        }
      }

      // 设置语言按钮状态
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });

      // 绑定事件
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          switchLanguage(btn.dataset.lang);
        });
      });

      // 初始渲染
      renderVersions();
    }

    // DOM 加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
